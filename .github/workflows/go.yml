name: Go

on:
  pull_request:
    branches: [ develop ]

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23.x', '1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Test
        run: go test -race ./... ./bind/logrus/... ./bind/zap/... ./bind/zero/... ./bridge/... ./example/...
